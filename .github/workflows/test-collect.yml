
name: WIKIMASTER - Collecte automatique

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter les actualites
        run: python collect.py

      - name: Archiver les resultats
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wikimaster-articles-${{ github.run_id }}
          path: articles.json
          retention-days: 7
